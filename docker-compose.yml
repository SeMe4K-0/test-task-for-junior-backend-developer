services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: taskservice
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d taskservice"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations/000001_create_tasks.up.sql:/docker-entrypoint-initdb.d/000001_create_tasks.sql:ro
      - ./migrations/000002_create_task_generation_rules.up.sql:/docker-entrypoint-initdb.d/000002_create_task_generation_rules.sql:ro
      - ./migrations/000003_alter_recurrence_and_tasks_table.up.sql:/docker-entrypoint-initdb.d/000003_alter_recurrence_and_tasks_table.sql:ro

  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      HTTP_ADDR: :8080
      DATABASE_DSN: postgres://postgres:postgres@postgres:5432/taskservice?sslmode=disable
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  adminer:
    image: adminer
    ports:
      - 9090:8080

volumes:
  postgres_data:
